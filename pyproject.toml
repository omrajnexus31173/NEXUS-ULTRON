[build-system]
requires = ["setuptools>=66.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ultron"
version = "3.0.0"
description = "NEXUS ULTRON — Autonomous Personal AI Operating System (Personal Intelligence, Automation & Autonomous Execution System)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / Personal Autonomous System"}
authors = [
    {name = "NEXUS ULTRON Engineering"}
]
dependencies = [
    "PySide6-Essentials>=6.6.0",
    "psutil>=5.9.0",
    "cryptography>=42.0.0",
    "keyring>=24.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
windows = [
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pyttsx3>=2.90",
    "PySide6-Addons>=6.6.0",
]
browser = [
    "playwright>=1.44.0",
]
voice = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.6.0",
]

[project.scripts]
nexus-ultron = "nexus_ultron.cli:main"

[tool.setuptools.packages.find]
include = ["nexus_ultron*", "installer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
