name: Build Windows 10 x64 Desktop Executable & Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout NEXUS ULTRON
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Dependencies & QA Suite
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-windows.txt
          pip install pytest pytest-asyncio

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Chocolatey is pre-installed on windows-latest GitHub Actions runners.
          # jrsoftware.org/download.php/is.exe returns an HTML redirect page,
          # not a direct PE executable, so direct download+execute fails with a
          # corrupted-file error.
          choco install innosetup --yes --no-progress

          # Verify ISCC.exe is available and add its directory to GITHUB_PATH
          # so subsequent steps (iscc installer compilation) can find it.
          $isccPath = Get-Command ISCC.exe -ErrorAction Stop
          $isccDir = Split-Path -Parent $isccPath.Source
          echo "$isccDir" >> $env:GITHUB_PATH

          # Verify Inno Setup compiler works
          ISCC.exe /?

      - name: Run Full 30-Scenario Verification Suite on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Build Standalone NEXUS-ULTRON.exe via PyInstaller
        run: |
          pyinstaller installer/windows/pyinstaller_nexus_ultron.spec --distpath releases/win64_exe --workpath temp_pyi

      - name: Compile One-Click Windows Setup.exe via Inno Setup
        run: |
          iscc installer/windows/nexus_ultron_inno.iss

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ULTRON-Windows10-x64-Release
          path: releases/*
