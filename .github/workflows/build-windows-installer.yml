name: Build Windows 10 x64 Desktop Executable & Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout NEXUS ULTRON
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Dependencies & QA Suite
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-windows.txt
          pip install pytest pytest-asyncio

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:TEMP\is-setup.exe" -UserAgent "Mozilla/5.0"
          Start-Process -FilePath "$env:TEMP\is-setup.exe" -ArgumentList '/SP-','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Remove-Item "$env:TEMP\is-setup.exe"

      - name: Run Full 30-Scenario Verification Suite on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Build Standalone NEXUS-ULTRON.exe via PyInstaller
        run: |
          pyinstaller installer/windows/pyinstaller_nexus_ultron.spec --distpath releases/win64_exe --workpath temp_pyi

      - name: Compile One-Click Windows Setup.exe via Inno Setup
        run: |
          iscc installer/windows/nexus_ultron_inno.iss

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ULTRON-Windows10-x64-Release
          path: releases/*
